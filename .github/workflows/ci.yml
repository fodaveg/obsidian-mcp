name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Unit tests only: they exercise the pure helpers and never invoke the
      # `obsidian` binary, which does not exist on the runner.
      - name: Test
        run: npm test

      # The README's tool table is maintained by hand and drifted twice in one
      # day, so it is compared with the server's own `listTools`, and the
      # documented resource URIs with the templates the server offers. It starts
      # the server over stdio, calls no tool and reads no resource, so it needs
      # no vault either.
      - name: Check the README against the server
        run: npm run check:readme
